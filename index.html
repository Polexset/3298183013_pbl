<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Галерея | Связь со мной</title>
  <!-- Font Awesome 6 (бесплатные иконки) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      background-color: #000000;
      min-height: 100vh;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    /* контейнер галереи: центровка по горизонтали, ограничение ширины на ПК */
    .gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      max-width: 1000px;    /* комфортная ширина для десктопа (16:9 не растягивает) */
      margin: 0 auto;       /* центрирование блока */
      padding: 0;
      width: 100%;
    }

    /* стили для изображений */
    .gallery img {
      display: block;
      max-width: 100%;
      height: auto;
      width: auto;
      background-color: #000000;
    }

    /* блок с кнопками */
    .contact-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      max-width: 1000px;
      margin: 32px auto 48px auto;
      padding: 0 16px;
    }

    .contact-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #1e1e1e;
      backdrop-filter: blur(2px);
      padding: 12px 24px;
      border-radius: 60px;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 500;
      transition: all 0.2s ease;
      border: 1px solid #333;
      color: #ffffff;
    }

    .contact-btn i {
      font-size: 1.4rem;
    }

    /* цвета иконок/фона при наведении для узнаваемости */
    .contact-btn.telegram:hover {
      background: #0088cc;
      border-color: #0088cc;
    }
    .contact-btn.phone:hover {
      background: #2e7d32;
      border-color: #2e7d32;
    }
    .contact-btn.max:hover {
      background: #6c2b9b;
      border-color: #6c2b9b;
    }

    /* для мобильных: кнопки почти во всю ширину */
    @media (max-width: 640px) {
      .contact-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        margin: 24px auto 32px auto;
      }
      .contact-btn {
        justify-content: center;
        padding: 14px 20px;
        font-size: 1rem;
      }
      .contact-btn i {
        font-size: 1.3rem;
      }
    }

    /* крошечный отступ снизу для эстетики */
    body {
      padding-bottom: 20px;
    }
  </style>
</head>
<body>
